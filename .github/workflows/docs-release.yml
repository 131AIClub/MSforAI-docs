name: Build and release docs

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: docs-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Sync contributors and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release_sha: ${{ steps.release_revision.outputs.sha }}

    steps:
      - name: Check out the complete history
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Update contributor identities
        run: npm run contributors:update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build documentation
        run: npm run docs:build

      - name: Commit updated contributor identities
        shell: bash
        run: |
          git fetch origin master
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/master)" ]]; then
            echo "::error::master advanced while this run was building. Run the workflow again from the latest revision."
            exit 1
          fi

          git add -- docs/.vitepress/contributors.authors.json
          if git diff --cached --quiet; then
            echo "Contributor identities are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update contributor identities [skip ci]"
          git push origin HEAD:master

      - name: Record release revision
        id: release_revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify release revision is current
        shell: bash
        run: |
          git fetch origin master
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/master)" ]]; then
            echo "::error::The verified build is no longer the latest master revision."
            exit 1
          fi

      - name: Upload verified site
        uses: actions/upload-artifact@v4
        with:
          name: vitepress-site-${{ steps.release_revision.outputs.sha }}
          path: docs/.vitepress/dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  publish:
    name: Publish to Vercel
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    environment:
      name: Production

    steps:
      - name: Download verified site
        uses: actions/download-artifact@v4
        with:
          name: vitepress-site-${{ needs.quality.outputs.release_sha }}
          path: site

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Vercel credentials
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          for variable in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::${variable} is not configured."
              exit 1
            fi
          done

      - name: Verify production revision is current
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.quality.outputs.release_sha }}
        run: |
          remote_sha="$(git ls-remote https://github.com/131AIClub/MSforAI-docs.git refs/heads/master | cut -f1)"
          if [[ "$RELEASE_SHA" != "$remote_sha" ]]; then
            echo "::error::A newer master revision exists; refusing to publish an outdated artifact."
            exit 1
          fi

      - name: Deploy verified site to production
        working-directory: site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: >-
          npx --yes vercel@58.5.1 deploy
          --prod
          --yes
          --no-color
          --token "$VERCEL_TOKEN"
          --scope "$VERCEL_ORG_ID"
          --project "$VERCEL_PROJECT_ID"
          --meta "githubCommitSha=${{ needs.quality.outputs.release_sha }}"
          --meta "githubCommitRef=master"
          --meta "githubRepo=131AIClub/MSforAI-docs"
