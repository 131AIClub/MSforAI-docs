name: Build and release docs

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: docs-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Sync contributors, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release_sha: ${{ steps.release_revision.outputs.sha }}

    steps:
      - name: Check out the complete history
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Update contributor identities
        run: npm run contributors:update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build documentation
        run: npm run docs:build
        env:
          VITE_GISCUS_REPO: ${{ vars.VITE_GISCUS_REPO }}
          VITE_GISCUS_REPO_ID: ${{ vars.VITE_GISCUS_REPO_ID }}
          VITE_GISCUS_CATEGORY: ${{ vars.VITE_GISCUS_CATEGORY }}
          VITE_GISCUS_CATEGORY_ID: ${{ vars.VITE_GISCUS_CATEGORY_ID }}

      - name: Smoke test build output
        run: |
          test -f docs/.vitepress/dist/index.html || { echo "::error::index.html is missing from the build output"; exit 1; }
          test -f docs/.vitepress/dist/404.html || { echo "::error::404.html is missing from the build output"; exit 1; }
          test -d docs/.vitepress/dist/assets || { echo "::error::assets directory is missing from the build output"; exit 1; }
          echo "Build output passed smoke tests."

      - name: Commit updated contributor identities
        shell: bash
        run: |
          git fetch origin master
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/master)" ]]; then
            echo "::error::master advanced while this run was building. Run the workflow again from the latest revision."
            exit 1
          fi

          git add -- docs/.vitepress/contributors.authors.json
          if git diff --cached --quiet; then
            echo "Contributor identities are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update contributor identities [skip ci]"
          git push origin HEAD:master

      - name: Record release revision
        id: release_revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify release revision is current
        shell: bash
        run: |
          git fetch origin master
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/master)" ]]; then
            echo "::error::The verified build is no longer the latest master revision."
            exit 1
          fi

      - name: Upload verified site
        uses: actions/upload-artifact@v4
        with:
          name: vitepress-site-${{ steps.release_revision.outputs.sha }}
          path: docs/.vitepress/dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  publish:
    name: Publish to Vercel
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    environment:
      name: Production

    steps:
      - name: Download verified site
        uses: actions/download-artifact@v4
        with:
          name: vitepress-site-${{ needs.quality.outputs.release_sha }}
          path: site/dist

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Vercel credentials
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          for variable in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::${variable} is not configured."
              exit 1
            fi
          done

      - name: Verify production revision is current
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.quality.outputs.release_sha }}
        run: |
          remote_sha="$(git ls-remote https://github.com/131AIClub/MSforAI-docs.git refs/heads/master | cut -f1)"
          if [[ "$RELEASE_SHA" != "$remote_sha" ]]; then
            echo "::error::A newer master revision exists; refusing to publish an outdated artifact."
            exit 1
          fi

      - name: Link the existing Vercel project
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          mkdir -p site/.vercel
          node -e 'const fs = require("node:fs"); fs.writeFileSync("site/.vercel/project.json", `${JSON.stringify({ orgId: process.env.VERCEL_ORG_ID, projectId: process.env.VERCEL_PROJECT_ID })}\n`)'

      - name: Prepare Vercel prebuilt output
        run: |
          mkdir -p site/.vercel/output/static
          cp -R site/dist/. site/.vercel/output/static/
          node -e 'const fs = require("node:fs"); fs.writeFileSync("site/.vercel/output/config.json", `${JSON.stringify({ version: 3 })}\n`)'

      - name: Deploy verified site to production
        working-directory: site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TELEMETRY_DISABLED: "1"
        run: >-
          npx --yes vercel@58.5.1 deploy
          --prebuilt
          --prod
          --yes
          --no-color
          --token "$VERCEL_TOKEN"
          --meta "githubCommitSha=${{ needs.quality.outputs.release_sha }}"
          --meta "githubCommitRef=master"
          --meta "githubRepo=131AIClub/MSforAI-docs"

  deploy-alicloud:
    name: Deploy to Alibaba Cloud
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Download verified site
        uses: actions/download-artifact@v4
        with:
          name: vitepress-site-${{ needs.quality.outputs.release_sha }}
          path: site/dist

      - name: Validate deployment credentials
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          for variable in SSH_PRIVATE_KEY SERVER_HOST SERVER_USER; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::${variable} is not configured. Add it under Settings → Secrets and variables → Actions."
              exit 1
            fi
          done

      - name: Set up SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/msforai_deploy_key
          chmod 600 ~/.ssh/msforai_deploy_key

      - name: Trust server host key
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
        run: |
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" > /dev/null 2>&1 \
            || { echo "::error::Could not reach $SERVER_HOST on port $SERVER_PORT. Check that the port is open."; exit 1; }

      - name: Resolve incremental transfer base
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          RELEASE_SHA: ${{ needs.quality.outputs.release_sha }}
        run: |
          SSH_CMD="ssh -i ~/.ssh/msforai_deploy_key -p $SERVER_PORT -o BatchMode=yes -o ConnectTimeout=15"
          PREV=$($SSH_CMD "$SERVER_USER@$SERVER_HOST" '
            d=$(readlink /var/www/msforai-docs/current 2>/dev/null)
            if [[ -z "$d" || ! -d "$d" ]]; then
              d=$(ls -1dt /var/www/msforai-docs/releases/*/ 2>/dev/null | head -1)
            fi
            echo "${d%/}"
          ' 2>/dev/null || true)
          if [[ -n "$PREV" && "${PREV##*/}" != "$RELEASE_SHA" ]]; then
            echo "PREV_RELEASE=${PREV##*/}" >> "$GITHUB_ENV"
            echo "Incremental base: ${PREV##*/}"
          else
            echo "No incremental base; performing full transfer."
          fi

      - name: Upload site release (rsync, incremental)
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          RELEASE_SHA: ${{ needs.quality.outputs.release_sha }}
        run: |
          LINK_OPTS=()
          [[ -n "${PREV_RELEASE:-}" ]] && LINK_OPTS=(--link-dest="/var/www/msforai-docs/releases/$PREV_RELEASE")
          rsync -az --delete --partial --itemize-changes "${LINK_OPTS[@]}" \
            -e "ssh -i ~/.ssh/msforai_deploy_key -p $SERVER_PORT -o BatchMode=yes -o ConnectTimeout=15" \
            site/dist/ \
            "$SERVER_USER@$SERVER_HOST:/var/www/msforai-docs/releases/$RELEASE_SHA/"

      - name: Activate release atomically
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          RELEASE_SHA: ${{ needs.quality.outputs.release_sha }}
        run: |
          ssh -i ~/.ssh/msforai_deploy_key -p "$SERVER_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SERVER_USER@$SERVER_HOST" "/opt/msforai-docs/activate.sh $RELEASE_SHA"
