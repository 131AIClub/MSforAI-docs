<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 600" width="420" height="600" role="img" aria-label="机场套餐卡片示例：巨量不限时流量包，包含流量 260 GB，不限时永久流量用完 260G 为止，额外的优化线路与进阶系列节点（26 个地区），解锁当地热门平台，流量均价最便宜；最多支持 3 个设备同时在线使用，无法通过重复购买叠加流量；价格 38.80 元">
